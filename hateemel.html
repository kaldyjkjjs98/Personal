<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="dashboard.css">
  <title>personal dashboard</title>
</head>
<body>
   <div class="dashboard">
     <header>
       <h1>kaldys</h1>
       <p>selamat datang di personal dashboard</p>
     </header>
     <main>
       <section class="clock">
        <h2>20.00</h2>
         <p>rabu, 25 november 2026</p,>
       </section>

       <section class="weather">
  <h2>cuaca</h2>

  <div class="weather-info">
    <div id="ikon-cuaca">🌤️</div>

    <div class="weather-detail">
      <h3 id="suhu">--°C</h3>
      <p id="kondisi">menunggu data cuaca...</p>
      <p id="lokasi">belum ada lokasi</p>
    </div>
  </div>
       </section>

       <section class="notes">
         <h2>catatan</h2>
         <p>tulis apapun disini</p>
       </section>
         
       <section class="taks">
         <h2>to-do-list</h2>
         <p>belum ada tugas</p>
       </section>
  
     </main>
   </div>
  <script src="dashboard.js"></script>
</body>
</html>
